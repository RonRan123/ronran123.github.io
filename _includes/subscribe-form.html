<!--
  MailerLite Subscribe Form
  =========================
  Setup (one time):
    1. Log in at app.mailerlite.com
    2. Go to: Forms > Embedded Forms > your form > "Get the code"
    3. Replace the two placeholders below with your actual IDs:
       - REPLACE_WITH_YOUR_MAILERLITE_ACCOUNT_ID  (numeric, e.g. 1234567)
       - REPLACE_WITH_YOUR_FORM_ID                (numeric or short hash)
    4. Commit the file — the form appears at the bottom of /blog/
-->

<section class="subscribe">
  <h2>Subscribe</h2>
  <p>Get new posts by email. No spam, unsubscribe any time.</p>

  <script>
    (function(w,d,e,u,f,l,n){
      w[f]=w[f]||function(){(w[f].q=w[f].q||[]).push(arguments);};
      l=d.createElement(e);l.async=1;l.src=u;
      n=d.getElementsByTagName(e)[0];n.parentNode.insertBefore(l,n);
    })(window,document,'script',
      'https://assets.mailerlite.com/js/universal.js','ml');
    ml('account', 'REPLACE_WITH_YOUR_MAILERLITE_ACCOUNT_ID');
  </script>

  <div class="ml-embedded" data-form="REPLACE_WITH_YOUR_FORM_ID"></div>
</section>
